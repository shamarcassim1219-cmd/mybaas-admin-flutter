name: mybaas_admin
description: GOBAAS Admin - manage verifications, complaints, and platform activity.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  http: ^1.2.0

  # Secure token storage (encrypted, replaces localStorage)
  flutter_secure_storage: ^9.0.0

  # Icons matching the customer/Baas apps' line-icon style
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
